# Increase memory available to Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Fabric Properties
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.158.0+26.2

# Mod Properties
mod_version=1.1.10-fabric+mc26.2
maven_group=com.bmt.kaleidoscope_chinesefood
archives_base_name=kaleidoscope_chinesefood

# Dependencies
kaleidoscope_cookery_version=1.4.1.5
forge_config_api_version=26.2.1

# MC 26.x 是未混淆分发（无官方 mappings / 无 intermediary），关闭 Loom 混淆处理
fabric.loom.disableObfuscation=true
