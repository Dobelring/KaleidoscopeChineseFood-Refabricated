plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
	maven {
		name = "cassian's maven"
		url = "https://maven.cassian.cc"
	}
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// 26.1 起 Minecraft 无混淆，loom 自动识别 mod jar，modImplementation 等价于普通依赖
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:kaleidoscope-cookery-refabricated:${project.kaleidoscope_cookery_version}-fabric+mc${project.minecraft_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_version}"

	// Optional compat integrations (compileOnly - not bundled)
	compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")
	compileOnly "maven.modrinth:jade:${project.jade_version}"
	compileOnly("maven.modrinth:rrv:${project.rrv_version}") {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "eu.pb4")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

loom {
	// 26.x 无需 accessWidener：MenuType 构造器与 BlockEntityRenderers.register 均已 public
	splitEnvironmentSourceSets()

	mods {
		kaleidoscope_chinesefood {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
